name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Set up MoonBit
        run: bash .github/scripts/setup-moonbit.sh

      - name: Check formatting
        run: moon fmt --check

      - name: Check types and generated interface
        run: |
          moon check --frozen --deny-warn
          git diff --exit-code -- src/pkg.generated.mbti

      - name: Build
        run: moon build --frozen --deny-warn

      - name: Test (wasm-gc)
        run: moon test --frozen --deny-warn --target wasm-gc

      - name: Test (js)
        run: moon test --frozen --deny-warn --target js

      - name: Test (native)
        run: moon test --frozen --deny-warn --target native
